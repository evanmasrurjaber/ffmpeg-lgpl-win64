# Settings for one release of this build (D-045). Read by overlay/apply.sh, package.sh and
# .github/workflows/build.yml. Plain NAME=value lines only: bash sources this file and the
# Windows verify job parses it.
#
# The release is tagged ${FFMPEG_TAG}-r${BUILD_NUMBER} and `ffmpeg -version` prints the same.
# Raise BUILD_NUMBER for any rebuild of the same FFmpeg tag (a new pin, a library change, a
# workflow change); reset it to 1 for a new FFMPEG_TAG.

# FFmpeg release tag to build (https://github.com/FFmpeg/FFmpeg/tags)
FFMPEG_TAG=n9.0.2
BUILD_NUMBER=1

# The FFmpeg-Builds commit the upstream/ submodule must be checked out at: the newest commit
# at least 14 days old when it was pinned.
UPSTREAM_COMMIT=5031c6f1082414e53688d39e521849905071070d

# FFmpeg-Builds target, our variant, and the addin that selects FFmpeg 9.0's library set
TARGET=win64
VARIANT=lgpl-min
ADDIN=9.0
